<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Bag | AURA LUXE</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header scrolled">
        <div class="container nav-container">
            <div class="mobile-menu-btn" id="mobileMenuBtn">
                <span></span>
                <span></span>
                <span></span>
            </div>
            <div class="logo">
                <a href="index.html">AURA</a>
            </div>
            <nav class="main-nav" id="mainNav">
                <ul>
                    <li><a href="index.html">Collections</a></li>
                    <li><a href="index.html#featured">Curated</a></li>
                    <li><a href="index.html#shop">Shop All</a></li>
                    <li><a href="index.html#philosophy">Heritage</a></li>
                    <li class="mobile-only"><a href="account.html">Profile</a></li>
                    <li><a href="account.html#wishlist" class="mobile-only">Wishlist</a></li>
                </ul>
            </nav>
            <div class="header-icons">
                <div class="search-container">
                    <img src="https://img.icons8.com/material-outlined/20/ffffff/search--v1.png" alt="Search">
                    <input type="text" id="searchInput" placeholder="Search collection...">
                </div>
                <a href="account.html" class="icon account-icon" aria-label="Account">
                    <img src="https://img.icons8.com/material-outlined/24/000000/user-male-circle.png" alt="Account">
                </a>
                <div class="icon cart-icon" id="cartIconTrigger" aria-label="Cart" onclick="openCartDrawer()">
                    <img src="https://img.icons8.com/material-outlined/24/000000/shopping-cart.png" alt="Cart">
                    <span class="cart-count">0</span>
                </div>
            </div>
        </div>
    </header>

    <section class="cart-section" style="padding-top: 150px;">
        <div class="container">
            <h1 style="margin-bottom: 3rem;">Shopping Bag</h1>
            <div class="cart-container">
                <div class="cart-items" id="cartPageItems">
                    <!-- Items -->
                </div>
                <div class="order-summary glass" style="border-radius: 16px;">
                    <h3>Order Summary</h3>
                    <div class="summary-row">
                        <span>Shipping</span>
                        <span>Complimentary</span>
                    </div>
                    <div class="summary-row">
                        <span>Subtotal</span>
                        <span id="subtotal">₹0</span>
                    </div>
                    <div class="summary-row total">
                        <span>Total</span>
                        <span id="finalTotal">₹0</span>
                    </div>
                    <a href="checkout.html" class="btn btn-primary" style="width: 100%; margin-top: 2rem;">PROCEED TO CHECKOUT</a>
                    <a href="index.html#shop" class="continue-shopping">Continue Exploring</a>
                </div>
            </div>
        </div>
    </section>

    <script src="script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const container = document.getElementById('cartPageItems');
            const subtotalEl = document.getElementById('subtotal');
            const totalEl = document.getElementById('finalTotal');

            if (cart.length === 0) {
                container.innerHTML = `
                    <div class="empty-cart">
                        <p>Your shopping bag is currently empty.</p>
                        <a href="index.html#shop" class="btn btn-primary">EXPLORE COLLECTIONS</a>
                    </div>
                `;
                return;
            }

            container.innerHTML = cart.map((item, index) => `
                <div class="cart-item glass" style="margin-bottom: 1rem; padding: 2rem; border-radius: 12px; display: flex; gap: 2rem;">
                    <img src="${item.image}" style="width: 150px; border-radius: 8px;">
                    <div style="flex: 1;">
                        <div style="display: flex; justify-content: space-between;">
                            <h3>${item.name}</h3>
                            <button onclick="removeFromCart(${index}); location.reload();" class="remove-btn">Remove</button>
                        </div>
                        <p style="color: var(--text-muted); margin: 0.5rem 0;">Config: ${item.size} / Region: ${item.color}</p>
                        <p style="font-weight: 700; font-size: 1.25rem; margin-top: 1rem;">${formatPrice(item.price)} / mo</p>
                    </div>
                </div>
            `).join('');

            const total = cart.reduce((sum, item) => sum + item.price, 0);
            subtotalEl.textContent = formatPrice(total);
            totalEl.textContent = formatPrice(total);
        });
    </script>
</body>
</html>
