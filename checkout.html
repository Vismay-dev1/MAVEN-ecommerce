<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout | AURA LUXE</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header scrolled">
        <div class="container nav-container">
            <div class="mobile-menu-btn" id="mobileMenuBtn">
                <span></span>
                <span></span>
                <span></span>
            </div>
            <div class="logo">
                <a href="index.html">AURA</a>
            </div>
            <nav class="main-nav" id="mainNav">
                <ul>
                    <li><a href="index.html">Collections</a></li>
                    <li><a href="index.html#featured">Curated</a></li>
                    <li><a href="index.html#shop">Shop All</a></li>
                    <li><a href="index.html#philosophy">Heritage</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <section class="checkout-section" style="padding-top: 150px;">
        <div class="container">
            <div class="checkout-container">
                <div class="checkout-main glass" style="padding: 3rem; border-radius: 24px;">
                    <h3>Shipping Details</h3>
                    <form id="checkoutForm">
                        <div class="form-grid">
                            <div class="form-group">
                                <label>Full Name</label>
                                <input type="text" placeholder="John Doe" required>
                            </div>
                            <div class="form-group">
                                <label>Email Address</label>
                                <input type="email" placeholder="john@example.com" required>
                            </div>
                            <div class="form-group full">
                                <label>Shipping Address</label>
                                <input type="text" placeholder="123 Luxury Lane, Mumbai" required>
                            </div>
                        </div>

                        <h3 style="margin-top: 3rem;">Payment Method</h3>
                        <div class="shipping-options">
                            <label class="shipping-option glass">
                                <input type="radio" name="payment" checked>
                                <div class="option-details">
                                    <span>Credit / Debit Card</span>
                                    <span>Secure Encryption</span>
                                </div>
                            </label>
                            <label class="shipping-option glass">
                                <input type="radio" name="payment">
                                <div class="option-details">
                                    <span>UPI / Net Banking</span>
                                    <span>Instant Verification</span>
                                </div>
                            </label>
                        </div>

                        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 3rem;">COMPLETE PURCHASE</button>
                    </form>
                </div>

                <div class="order-summary-side glass" style="border-radius: 24px;">
                    <h3>Order Summary</h3>
                    <div id="summaryItems">
                        <!-- Items -->
                    </div>
                    <div class="summary-row total" style="margin-top: 2rem; border-top: 1px solid var(--border-dim); padding-top: 1rem;">
                        <span>Total</span>
                        <span id="finalTotal">₹0</span>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <script src="script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const summaryContainer = document.getElementById('summaryItems');
            const totalEl = document.getElementById('finalTotal');

            summaryContainer.innerHTML = cart.map(item => `
                <div class="summary-item" style="display: flex; justify-content: space-between; margin-bottom: 0.5rem; font-size: 0.9rem;">
                    <span>${item.name} (${item.size})</span>
                    <span>${formatPrice(item.price)}</span>
                </div>
            `).join('');

            const total = cart.reduce((sum, item) => sum + item.price, 0);
            totalEl.textContent = formatPrice(total);

            document.getElementById('checkoutForm').addEventListener('submit', (e) => {
                e.preventDefault();
                alert('Your order has been placed successfully. A confirmation email has been sent.');
                localStorage.removeItem('maven_cart');
                window.location.href = 'index.html';
            });
        });
    </script>
</body>
</html>
